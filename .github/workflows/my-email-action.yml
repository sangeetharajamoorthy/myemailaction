name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'  # Runs at 00:00 UTC every day (adjust as needed)

jobs:
  daily_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Add a file or modify an existing one
        run: |
          echo "Updated at $(date)" > daily_update.txt  # Add/update a file
          git add daily_update.txt

      - name: Commit changes (sangeetha.rajamoorthy@straive.com)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily automatic commit"
          email: "sangeetha.rajamoorthy@straive.com" # Your email here
          github_token: ${{ secrets.GITHUB_TOKEN }}
